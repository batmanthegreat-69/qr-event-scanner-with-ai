<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — QR Attendance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-page">
  <button id="theme-toggle-btn" type="button" class="login-theme-toggle" aria-label="Toggle dark mode"></button>
  <main class="login-layout">
    <section class="card login-card">
      <div class="card-body">
        <header class="login-header text-center">
        <img src="/images/school-logo.png" alt="School Logo" class="split-logo-img" />
        <h1 class="card-title mb-1">Welcome back</h1>
        <p class="login-intro">Sign in to your QR Attendance account.</p>
        </header>
        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label">Email/ID number</label>
            <input type="email" id="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>

        <div id="login-status" class="status-msg mt-3" style="display:none;"></div>
        <p class="auth-link-row mt-3 mb-0 text-center small">
          Don’t have an account? <a href="/register.html">Register here</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('login-status');

      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body)
        });
        const data = await res.json();

        statusEl.style.display = 'block';
        if (data.success) {
          statusEl.className = 'status-msg success mt-3';
          statusEl.textContent = `Welcome, ${data.user.name}! Redirecting...`;
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? '/dashboard.html' : '/student-dashboard.html';
          }, 1000);
        } else {
          statusEl.className = 'status-msg error mt-3';
          statusEl.textContent = data.message;
        }
      } catch (err) {
        statusEl.style.display = 'block';
        statusEl.className = 'status-msg error mt-3';
        statusEl.textContent = 'Network error during login';
      }
    });
  </script>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
