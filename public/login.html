<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — QR Attendance</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="split-layout">
    <div class="split-left">
      <div class="split-logo">
        <img src="/images/school-logo.png" alt="School Logo" />
      </div>
      <div class="split-welcome">WELCOME<br />TO<br />EVENT<br />QR SCANNER</div>
    </div>

    <div class="split-right">
      <div class="card form-card">
        <h2>Login</h2>
        <form id="login-form">
          <label for="email">Email/Id number</label>
          <input type="email" id="email" required />

          <label for="password">Password</label>
          <input type="password" id="password" required />

          <button type="submit" class="btn" style="width:100%;">Log In</button>
        </form>

        <div id="login-status" class="status-msg" style="display:none;"></div>
        <p style="margin-top: 1rem; font-size: 0.9rem; text-align: center;">
          No Account yet? <a href="/register.html">Register</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('login-status');

      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include', // ensures the JWT cookie gets stored in the browser
          body: JSON.stringify(body)
        });
        const data = await res.json();

        statusEl.style.display = 'block';
        if (data.success) {
          statusEl.className = 'status-msg success';
          statusEl.textContent = `Welcome, ${data.user.name}! Redirecting...`;

          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? '/dashboard.html' : '/student-dashboard.html';
          }, 1000);
        } else {
          statusEl.className = 'status-msg error';
          statusEl.textContent = data.message;
        }
      } catch (err) {
        statusEl.style.display = 'block';
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'Network error during login';
      }
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
