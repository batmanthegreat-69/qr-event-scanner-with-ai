<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Event — QR Attendance</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="navbar">
    <h1>📋 QR Attendance</h1>
    <nav>
      <a href="/dashboard.html" data-role="admin">Dashboard</a>
      <a href="/scan.html" data-role="admin">Scan</a>
      <a href="/events.html" data-role="admin">Events</a>
      <a href="/register.html">Register</a>
      <a href="/login.html">Login</a>
    </nav>
  </div>

  <div class="container">
    <div class="card form-card">
      <h2>Create Event</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-top: -0.5rem;">
        You must be logged in as an admin (via /login.html) for this to work.
      </p>
      <form id="event-form">
        <label for="title">Event Title</label>
        <input type="text" id="title" required placeholder="e.g. Weekly Assembly" />

        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Optional details"></textarea>

        <label for="event_date">Event Date</label>
        <input type="date" id="event_date" required />

        <label for="event_time">Event Start Time</label>
        <input type="time" id="event_time" required />

        <label for="end_time">Event End Time</label>
        <input type="time" id="end_time" required />

        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g. Main Gym" />

        <button type="submit" class="btn" style="width:100%;">Create Event</button>
      </form>

      <div id="event-status" class="status-msg" style="display:none;"></div>
    </div>

    <div class="card" style="max-width: 420px; margin: 0 auto;">
      <h3>Existing Events</h3>
      <table>
        <thead><tr><th>Title</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
        <tbody id="events-body"><tr><td colspan="4" style="color: var(--muted);">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    const statusBadgeClass = { upcoming: 'present', ongoing: 'late', completed: '' };
    const statusLabel = { upcoming: 'Upcoming', ongoing: 'Ongoing', completed: 'Completed' };

    async function loadEvents() {
      const tbody = document.getElementById('events-body');
      try {
        const res = await fetch('/api/events?scope=all');
        const data = await res.json();
        if (data.success && data.events.length > 0) {
          tbody.innerHTML = data.events
            .map((e) => {
              const badgeClass = statusBadgeClass[e.status] || '';
              const label = statusLabel[e.status] || e.status;
              const badge = badgeClass
                ? `<span class="badge ${badgeClass}">${label}</span>`
                : `<span class="badge" style="background: var(--border); color: var(--muted);">${label}</span>`;
              return `<tr><td>${e.title}</td><td>${e.event_date}</td><td>${e.event_time}</td><td>${badge}</td></tr>`;
            })
            .join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="4" style="color: var(--muted);">No events yet.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" style="color: var(--muted);">Could not load events.</td></tr>';
      }
    }

    document.getElementById('event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('event-status');

      const body = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        event_date: document.getElementById('event_date').value,
        event_time: document.getElementById('event_time').value,
        end_time: document.getElementById('end_time').value,
        location: document.getElementById('location').value
      };

      try {
        const res = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include', // sends the admin JWT cookie set during login
          body: JSON.stringify(body)
        });
        const data = await res.json();

        statusEl.style.display = 'block';
        if (data.success) {
          statusEl.className = 'status-msg success';
          statusEl.textContent = data.message;
          document.getElementById('event-form').reset();
          loadEvents();
        } else {
          statusEl.className = 'status-msg error';
          statusEl.textContent = data.message;
        }
      } catch (err) {
        statusEl.style.display = 'block';
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'Network error creating event';
      }
    });

    loadEvents();
  </script>
  <script src="/js/navigation.js"></script>
  <script src="/js/theme.js"></script>

</body>
</html>
