<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — QR Attendance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="register-page">
  <button id="theme-toggle-btn" type="button" class="register-theme-toggle" aria-label="Toggle dark mode"></button>
  <main class="register-layout">
    <section class="card register-card">
      <div class="card-body">
        <header class="register-header text-center">
        <img src="/images/school-logo.png" alt="School Logo" class="split-logo-img" />
        <h1 class="register-title">Create Account</h1>
        <p class="register-intro">Enter your details to create an account.</p>
        </header>
        <form id="register-form">
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required minlength="6" />
              </div>

              <div id="student-fields">
                <div class="mb-3">
                  <label for="student_id" class="form-label">Student ID</label>
                  <input type="text" id="student_id" class="form-control" />
                </div>
                <div class="mb-3">
                  <label for="year_level" class="form-label">Year Level</label>
                  <select id="year_level" class="form-select">
                    <option value="">Select year level</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="block" class="form-label">Block</label>
                  <select id="block" class="form-select">
                    <option value="">Select block</option>
                    <option value="A">Block A</option>
                    <option value="B">Block B</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>

        <div id="register-status" class="status-msg mt-3" style="display:none;"></div>
        <div class="qr-preview text-center" id="qr-preview"></div>
        <p class="register-login-link mt-3 mb-0 text-center small">
          Already have an account? <a href="/login.html">Login here</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    const studentFields = document.getElementById('student-fields');
    const studentIdInput = document.getElementById('student_id');
    const yearLevelSelect = document.getElementById('year_level');
    const blockSelect = document.getElementById('block');

    function syncStudentFieldRequirements() {
      studentFields.style.display = 'block';
      studentIdInput.required = true;
      yearLevelSelect.required = true;
      blockSelect.required = true;
    }

    syncStudentFieldRequirements();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('register-status');
      const qrPreview = document.getElementById('qr-preview');

      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        student_id: studentIdInput.value || undefined,
        year_level: yearLevelSelect.value ? Number(yearLevelSelect.value) : undefined,
        block: blockSelect.value || undefined
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        statusEl.style.display = 'block';
        if (data.success) {
          statusEl.className = 'status-msg success mt-3';
          statusEl.textContent = data.message;
          qrPreview.innerHTML = data.qr_code
            ? `<p class="mt-2">Student QR Code:</p><img src="${data.qr_code}" alt="Student QR Code" />`
            : '';
          document.getElementById('register-form').reset();
          syncStudentFieldRequirements();
        } else {
          statusEl.className = 'status-msg error mt-3';
          statusEl.textContent = data.message;
        }
      } catch (err) {
        statusEl.style.display = 'block';
        statusEl.className = 'status-msg error mt-3';
        statusEl.textContent = 'Network error during registration';
      }
    });
  </script>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
